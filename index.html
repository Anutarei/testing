<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-image: url(https://i.pinimg.com/originals/1d/40/42/1d40421ba59e8c8ed34c579b840c944c.jpg);
            background-repeat: repeat-x;
            font-family: Arial, sans-serif;
            position: relative;
            min-height: 100vh;
            margin: 0;
        }

        body::before {
            content: "ВАШ ТЕКСТ НА ФОНЕ";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.15);
            z-index: -1;
            pointer-events: none;
            white-space: nowrap;
            opacity: 0.3;
            letter-spacing: 3px;
        }

        h1 {
            color: yellow;
            text-align: center;
        }
        h2 {
            color: green;
            text-align: center;
        }
        h3 {
            color: blue;
            text-align: center;
        }
        h4 {
            color: red;
            text-align: center;
        }
        p {
            text-align: right;
        }
        ul {
            padding-left: 20px;
        }
        ol {
            padding-left: 20px;
        }
        li:nth-child(1) { color: red; }
        li:nth-child(2) { color: orange; }
        li:nth-child(3) { color: yellow; }
        li:nth-child(4) { color: green; }
        li:nth-child(5) { color: blue; }
        li:nth-child(6) { color: indigo; }
        li:nth-child(7) { color: violet; }
    </style>
</head>
<body>
    <h1>Заголовок </h1>
    <p>1 абзац </p>
    <p>2 абзац </p>
    <p>3 абзац </p>

    <h2>Заголовок </h2>
    <ol>
        <li>Первый элемент </li>
        <li>Второй элемент </li>
        <li>Третий элемент </li>
    </ol>

    <h3>Заголовок </h3>
    <ul>
        <li>Элемент 1</li>
        <li>Элемент 2</li>
        <li>Элемент 3</li>
        <li>Элемент 4</li>
        <li>Элемент 5</li>
        <li>Элемент 6</li>
        <li>Элемент 7</li>
    </ul>

    <h4>Заголовок </h4>
    <br><strong>Жирный текст</strong>
    <br><em>Наклонный текст</em>
    <br>Обычный текст

    <br><a href="задание.html">Второй документ</a>
</body>
</html>
